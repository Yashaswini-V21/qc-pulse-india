name: Bug Report
description: Report a bug or issue
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in the details below.
  
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Brief description of the bug
      placeholder: "e.g., Dashboard crashes when opening Price Intelligence page"
    validations:
      required: true
  
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the bug
      placeholder: |
        1. Run `streamlit run app.py`
        2. Click on "Price Intelligence" page
        3. ...
    validations:
      required: true
  
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: "Price heatmap should render correctly"
    validations:
      required: true
  
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: "Got error: IndexError: list index out of range"
    validations:
      required: true
  
  - type: textarea
    id: error
    attributes:
      label: Error Log
      description: Paste full error traceback
      render: python
  
  - type: input
    id: python
    attributes:
      label: Python Version
      placeholder: "e.g., 3.10.5"
    validations:
      required: true
  
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g., Windows 10, macOS 12.5"
    validations:
      required: true
